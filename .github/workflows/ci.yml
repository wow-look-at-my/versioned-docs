name: CI

on:
  push:
  # workflow_dispatch serves two purposes: manual runs, and the scheduled
  # refresh (refresh.yml re-dispatches this workflow because buildhost
  # rejects OIDC tokens minted in schedule-event runs).
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # autorelease is off: the site is this repo's product, not the binary,
      # and autorelease fails the whole job with "Release exists" on any
      # push that does not change Go sources (workflow/docs-only commits).
      - uses: wow-look-at-my/go-toolchain@v1
        with:
          autorelease: 'false'

      # The deploy job reuses this build instead of running go-toolchain a
      # second time: go-toolchain would re-attempt its buildhost publishing
      # there, and buildhost only accepts OIDC tokens from allowlisted event
      # types — keeping go-toolchain out of the deploy job keeps dispatched
      # deploys from dying inside the toolchain step.
      - uses: actions/upload-artifact@v4
        with:
          name: versioned-docs-build
          path: build/

  deploy:
    needs: test
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: versioned-docs-build
          path: build

      # Site branch = git ref with slashes flattened (matches how other org
      # repos publish, e.g. cc-marketplace). master deploys to
      # sites.pazer.build/versioned-docs/branch/master/.
      - name: Compute site branch name
        id: branch
        run: echo "branch=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      # The corpus repo (PazerOP/claude-docs-gaps) is PRIVATE and cross-owner,
      # so this repo's GITHUB_TOKEN cannot read it, and no org secret readable
      # from here can either. Instead of failing every master push red, the
      # deploy probes first and skips green — with a loud warning — until the
      # optional CLAUDE_DOCS_GAPS_TOKEN repo secret exists (or the corpus repo
      # goes public). It likewise skips when the site profile is absent.
      - name: Check the site profile exists
        id: profile
        continue-on-error: true
        run: test -f gapsdocs/config.yaml

      - name: Warn that the deploy is skipped (no site profile)
        if: steps.profile.outcome == 'failure'
        run: |
          MSG="site profile gapsdocs/config.yaml missing — site build skipped"
          echo "::warning::$MSG"
          echo "$MSG" >> "$GITHUB_STEP_SUMMARY"

      - name: Probe corpus readability
        id: probe
        if: steps.profile.outcome == 'success'
        continue-on-error: true
        env:
          CORPUS_TOKEN: ${{ secrets.CLAUDE_DOCS_GAPS_TOKEN }}
          FALLBACK_TOKEN: ${{ github.token }}
        run: |
          echo "corpus credential: repo secret CLAUDE_DOCS_GAPS_TOKEN available: ${CORPUS_TOKEN:+true} (empty = github.token fallback, which cannot read the private corpus repo)"
          TOKEN="${CORPUS_TOKEN:-$FALLBACK_TOKEN}"
          git ls-remote --exit-code "https://x-access-token:${TOKEN}@github.com/PazerOP/claude-docs-gaps.git" HEAD > /dev/null

      - name: Warn that the deploy is skipped (corpus unreadable)
        if: steps.probe.outcome == 'failure'
        run: |
          MSG="No credential available to this run can read PazerOP/claude-docs-gaps — deploy skipped. To enable deploys: create repo secret CLAUDE_DOCS_GAPS_TOKEN containing a token that can read PazerOP/claude-docs-gaps, or make that repo public."
          echo "::warning::$MSG"
          echo "$MSG" >> "$GITHUB_STEP_SUMMARY"

      - name: Build site from the claude-docs-gaps corpus
        if: steps.probe.outcome == 'success'
        env:
          CORPUS_TOKEN: ${{ secrets.CLAUDE_DOCS_GAPS_TOKEN }}
          FALLBACK_TOKEN: ${{ github.token }}
          # The go-toolchain action builds per-platform binaries
          # (versioned-docs_<os>_<arch>), not the local CLI's single binary.
          VERSIONED_DOCS_BIN: ${{ github.workspace }}/build/versioned-docs_linux_amd64
        run: |
          TOKEN="${CORPUS_TOKEN:-$FALLBACK_TOKEN}"
          export GAPS_REMOTE_URL="https://x-access-token:${TOKEN}@github.com/PazerOP/claude-docs-gaps.git"
          chmod +x "$VERSIONED_DOCS_BIN"
          "$VERSIONED_DOCS_BIN" -config gapsdocs/config.yaml -content gapsdocs/content -out site -base-url "/versioned-docs/branch/${{ steps.branch.outputs.branch }}"

      - name: Publish site to buildhost
        if: steps.probe.outcome == 'success'
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish-site@master
        with:
          server: https://pazer.build
          project: versioned-docs
          branch: ${{ steps.branch.outputs.branch }}
          source_dir: site

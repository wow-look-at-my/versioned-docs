name: CI

on:
  push:
  # workflow_dispatch serves two purposes: manual runs, and the scheduled
  # refresh (refresh.yml re-dispatches this workflow because buildhost
  # rejects OIDC tokens minted in schedule-event runs).
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # autorelease is off: the site is this repo's product, not the binary,
      # and autorelease fails the whole job with "Release exists" on any
      # push that does not change Go sources (workflow/docs-only commits).
      - uses: wow-look-at-my/go-toolchain@v1
        with:
          autorelease: 'false'

      # The deploy job reuses this build instead of running go-toolchain a
      # second time: go-toolchain would re-attempt its buildhost publishing
      # there, and buildhost only accepts OIDC tokens from allowlisted event
      # types — keeping go-toolchain out of the deploy job keeps dispatched
      # deploys from dying inside the toolchain step.
      - uses: actions/upload-artifact@v4
        with:
          name: versioned-docs-build
          path: build/

  deploy:
    needs: test
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: versioned-docs-build
          path: build

      # Site branch = git ref with slashes flattened (matches how other org
      # repos publish, e.g. cc-marketplace). master deploys to
      # sites.pazer.build/versioned-docs/branch/master/.
      - name: Compute site branch name
        id: branch
        run: echo "branch=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Build site from the claude-docs-gaps corpus
        env:
          # claude-docs-gaps is PRIVATE and owned by PazerOP (a different
          # owner), so this repo's GITHUB_TOKEN cannot read it. Credential
          # order: the org read secret if this repo is granted access to it,
          # else the PRIVATE_ORG_REPO_READ env var (exported by go-toolchain
          # in jobs that run it — not this one), else GITHUB_TOKEN, in which
          # case fetch-aggregate fails loudly with a clear error.
          ORG_READ_SECRET: ${{ secrets.PRIVATE_ORG_REPO_READ }}
          FALLBACK_TOKEN: ${{ github.token }}
          # The go-toolchain action builds per-platform binaries
          # (versioned-docs_<os>_<arch>), not the local CLI's single binary.
          VERSIONED_DOCS_BIN: ${{ github.workspace }}/build/versioned-docs_linux_amd64
        run: |
          echo "corpus credential: org secret available: ${ORG_READ_SECRET:+true} / org env present: ${PRIVATE_ORG_REPO_READ:+true} (neither = GITHUB_TOKEN fallback, which cannot read the private corpus repo)"
          TOKEN="${ORG_READ_SECRET:-${PRIVATE_ORG_REPO_READ:-$FALLBACK_TOKEN}}"
          export GAPS_REMOTE_URL="https://x-access-token:${TOKEN}@github.com/PazerOP/claude-docs-gaps.git"
          chmod +x "$VERSIONED_DOCS_BIN"
          "$VERSIONED_DOCS_BIN" -config gapsdocs/config.yaml -content gapsdocs/content -out site -base-url "/versioned-docs/branch/${{ steps.branch.outputs.branch }}"

      - name: Publish site to buildhost
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish-site@master
        with:
          server: https://pazer.build
          project: versioned-docs
          branch: ${{ steps.branch.outputs.branch }}
          source_dir: site

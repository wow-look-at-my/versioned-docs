name: CI

on:
  push:

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tests, coverage gate, build, release in one step: go-toolchain's
      # autorelease publishes the built binaries to the buildhost project
      # `versioned-docs` (GitHub OIDC), so consumers can download e.g.
      #   https://dl.pazer.build/versioned-docs?branch=master&os=linux&arch=amd64
      - uses: wow-look-at-my/go-toolchain@v1

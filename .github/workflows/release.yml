name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@latest

      - name: Create or update rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Delete existing "latest" release so we can recreate it
          gh release delete latest --yes 2>/dev/null || true
          git tag -f latest
          git push origin latest --force
          gh release create latest --title "Latest" --notes "Built from $(git rev-parse --short HEAD)" --latest
          gh release upload latest build/versioned-docs_* --clobber

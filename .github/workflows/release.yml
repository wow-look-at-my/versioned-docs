name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: wow-look-at-my/go-toolchain@v1

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build -trimpath -ldflags="-s -w" -o "versioned-docs_${GOOS}_${GOARCH}${ext}" .

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          asset="versioned-docs_${GOOS}_${GOARCH}${ext}"
          tag="${GITHUB_REF#refs/tags/}"

          # Create release if it doesn't exist yet (first matrix job to finish)
          gh release create "$tag" --generate-notes 2>/dev/null || true

          gh release upload "$tag" "$asset" --clobber

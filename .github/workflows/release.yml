name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@latest

      - name: Create release and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(date -u +%Y%m%d%H%M%S)-$(git rev-parse --short HEAD)"
          git tag "$tag"
          git push origin "$tag"
          gh release create "$tag" --generate-notes
          gh release upload "$tag" build/versioned-docs_* --clobber

name: PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

# Caller permissions required by the reusable buildhost-preview workflow:
# id-token for the OIDC upload, actions: read for the artifact download,
# pull-requests: write for the sticky preview comment.
permissions:
  contents: read
  actions: read
  pull-requests: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # buildhost-preview has no cleanup path, so a closed PR just stops
    # deploying (previews are per-branch uploads on buildhost).
    if: github.event.action != 'closed'
    outputs:
      corpus_ok: ${{ steps.probe.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      # autorelease off for the same reason as ci.yml: it fails on pushes
      # that do not change Go sources, and the preview needs the binary,
      # not a buildhost binary release.
      - uses: wow-look-at-my/go-toolchain@v1
        with:
          autorelease: 'false'

      # The corpus repo is PRIVATE and cross-owner. Unlike the deploy job
      # (which must fail loudly), an unreadable corpus only downgrades the
      # preview to a warning — otherwise the required all-builds gate stays
      # permanently red on every PR until the credential exists.
      # Credential order: org secret, else the PRIVATE_ORG_REPO_READ env var
      # exported by the go-toolchain step above, else GITHUB_TOKEN.
      - name: Probe corpus readability
        id: probe
        continue-on-error: true
        env:
          ORG_READ_SECRET: ${{ secrets.PRIVATE_ORG_REPO_READ }}
          FALLBACK_TOKEN: ${{ github.token }}
        run: |
          echo "corpus credential: org secret available: ${ORG_READ_SECRET:+true} / org env present: ${PRIVATE_ORG_REPO_READ:+true} (neither = GITHUB_TOKEN fallback)"
          TOKEN="${ORG_READ_SECRET:-${PRIVATE_ORG_REPO_READ:-$FALLBACK_TOKEN}}"
          git ls-remote --exit-code "https://x-access-token:${TOKEN}@github.com/PazerOP/claude-docs-gaps.git" HEAD > /dev/null

      - name: Warn that the preview is skipped
        if: steps.probe.outcome == 'failure'
        run: echo "::warning::No credential available to this run can read PazerOP/claude-docs-gaps (grant the PRIVATE_ORG_REPO_READ secret to this repo, with a token that can read the corpus repo). Skipping the PR preview."

      - name: Build site from the claude-docs-gaps corpus
        if: steps.probe.outcome == 'success'
        env:
          ORG_READ_SECRET: ${{ secrets.PRIVATE_ORG_REPO_READ }}
          FALLBACK_TOKEN: ${{ github.token }}
          # The go-toolchain action builds per-platform binaries.
          VERSIONED_DOCS_BIN: ${{ github.workspace }}/build/versioned-docs_linux_amd64
        run: |
          TOKEN="${ORG_READ_SECRET:-${PRIVATE_ORG_REPO_READ:-$FALLBACK_TOKEN}}"
          export GAPS_REMOTE_URL="https://x-access-token:${TOKEN}@github.com/PazerOP/claude-docs-gaps.git"
          "$VERSIONED_DOCS_BIN" -config gapsdocs/config.yaml -content gapsdocs/content -out site -base-url "/versioned-docs/branch/pr-${{ github.event.number }}"

      - uses: actions/upload-artifact@v4
        if: steps.probe.outcome == 'success'
        with:
          name: site
          path: site/

  preview:
    needs: build
    if: github.event.action != 'closed' && needs.build.outputs.corpus_ok == 'true'
    uses: wow-look-at-my/actions/.github/workflows/buildhost-preview.yml@master
    with:
      artifact-name: site

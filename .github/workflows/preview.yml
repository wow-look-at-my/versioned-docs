name: PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

# Caller permissions required by the reusable buildhost-preview workflow:
# id-token for the OIDC upload, actions: read for the artifact download,
# pull-requests: write for the sticky preview comment.
permissions:
  contents: read
  actions: read
  pull-requests: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # buildhost-preview has no cleanup path, so a closed PR just stops
    # deploying (previews are per-branch uploads on buildhost).
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@v4

      # autorelease off for the same reason as ci.yml: it fails on pushes
      # that do not change Go sources, and the preview needs the binary,
      # not a buildhost binary release.
      - uses: wow-look-at-my/go-toolchain@v1
        with:
          autorelease: 'false'

      - name: Build site from the claude-docs-gaps corpus
        env:
          # See ci.yml: private cross-owner corpus repo. Credential order:
          # org secret, else the PRIVATE_ORG_REPO_READ env var exported by
          # the go-toolchain step above, else GITHUB_TOKEN (fails loudly).
          ORG_READ_SECRET: ${{ secrets.PRIVATE_ORG_REPO_READ }}
          FALLBACK_TOKEN: ${{ github.token }}
          # The go-toolchain action builds per-platform binaries.
          VERSIONED_DOCS_BIN: ${{ github.workspace }}/build/versioned-docs_linux_amd64
        run: |
          echo "corpus credential: org secret available: ${ORG_READ_SECRET:+true} / org env present: ${PRIVATE_ORG_REPO_READ:+true} (neither = GITHUB_TOKEN fallback, which cannot read the private corpus repo)"
          TOKEN="${ORG_READ_SECRET:-${PRIVATE_ORG_REPO_READ:-$FALLBACK_TOKEN}}"
          export GAPS_REMOTE_URL="https://x-access-token:${TOKEN}@github.com/PazerOP/claude-docs-gaps.git"
          "$VERSIONED_DOCS_BIN" -config gapsdocs/config.yaml -content gapsdocs/content -out site -base-url "/versioned-docs/branch/pr-${{ github.event.number }}"

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/

  preview:
    needs: build
    if: github.event.action != 'closed'
    uses: wow-look-at-my/actions/.github/workflows/buildhost-preview.yml@master
    with:
      artifact-name: site

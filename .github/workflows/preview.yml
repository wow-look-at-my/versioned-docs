name: PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

# Caller permissions required by the reusable buildhost-preview workflow:
# id-token for the OIDC upload, actions: read for the artifact download,
# pull-requests: write for the sticky preview comment.
permissions:
  contents: read
  actions: read
  pull-requests: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # buildhost-preview has no cleanup path, so a closed PR just stops
    # deploying (previews are per-branch uploads on buildhost).
    if: github.event.action != 'closed'
    outputs:
      corpus_ok: ${{ steps.probe.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      # autorelease off for the same reason as ci.yml: it fails on pushes
      # that do not change Go sources, and the preview needs the binary,
      # not a buildhost binary release.
      - uses: wow-look-at-my/go-toolchain@v1
        with:
          autorelease: 'false'

      # The corpus repo (PazerOP/claude-docs-gaps) is PRIVATE and cross-owner,
      # and no credential this repo holds by default can read it. A missing
      # site profile or an unreadable corpus only downgrades the preview to a
      # warning — otherwise the required all-builds gate stays permanently red
      # on every PR until the credential exists. Credential: the optional
      # CLAUDE_DOCS_GAPS_TOKEN repo secret if set, else GITHUB_TOKEN.
      - name: Check the site profile exists
        id: profile
        continue-on-error: true
        run: test -f gapsdocs/config.yaml

      - name: Warn that the preview is skipped (no site profile)
        if: steps.profile.outcome == 'failure'
        run: |
          MSG="site profile gapsdocs/config.yaml missing — PR preview skipped"
          echo "::warning::$MSG"
          echo "$MSG" >> "$GITHUB_STEP_SUMMARY"

      - name: Probe corpus readability
        id: probe
        if: steps.profile.outcome == 'success'
        continue-on-error: true
        env:
          CORPUS_TOKEN: ${{ secrets.CLAUDE_DOCS_GAPS_TOKEN }}
          FALLBACK_TOKEN: ${{ github.token }}
        run: |
          echo "corpus credential: repo secret CLAUDE_DOCS_GAPS_TOKEN available: ${CORPUS_TOKEN:+true} (empty = github.token fallback)"
          TOKEN="${CORPUS_TOKEN:-$FALLBACK_TOKEN}"
          git ls-remote --exit-code "https://x-access-token:${TOKEN}@github.com/PazerOP/claude-docs-gaps.git" HEAD > /dev/null

      - name: Warn that the preview is skipped (corpus unreadable)
        if: steps.probe.outcome == 'failure'
        run: |
          MSG="No credential available to this run can read PazerOP/claude-docs-gaps — PR preview skipped. To enable: create repo secret CLAUDE_DOCS_GAPS_TOKEN containing a token that can read PazerOP/claude-docs-gaps, or make that repo public."
          echo "::warning::$MSG"
          echo "$MSG" >> "$GITHUB_STEP_SUMMARY"

      - name: Build site from the claude-docs-gaps corpus
        if: steps.probe.outcome == 'success'
        env:
          CORPUS_TOKEN: ${{ secrets.CLAUDE_DOCS_GAPS_TOKEN }}
          FALLBACK_TOKEN: ${{ github.token }}
          # The go-toolchain action builds per-platform binaries.
          VERSIONED_DOCS_BIN: ${{ github.workspace }}/build/versioned-docs_linux_amd64
        run: |
          TOKEN="${CORPUS_TOKEN:-$FALLBACK_TOKEN}"
          export GAPS_REMOTE_URL="https://x-access-token:${TOKEN}@github.com/PazerOP/claude-docs-gaps.git"
          "$VERSIONED_DOCS_BIN" -config gapsdocs/config.yaml -content gapsdocs/content -out site -base-url "/versioned-docs/branch/pr-${{ github.event.number }}"

      - uses: actions/upload-artifact@v4
        if: steps.probe.outcome == 'success'
        with:
          name: site
          path: site/

  preview:
    needs: build
    if: github.event.action != 'closed' && needs.build.outputs.corpus_ok == 'true'
    uses: wow-look-at-my/actions/.github/workflows/buildhost-preview.yml@master
    with:
      artifact-name: site
